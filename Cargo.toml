[workspace]
members = [
    "crates/servo-desktop",
    "examples/desktop-app",
]
resolver = "2"

[workspace.dependencies]
notify-rust = "4.18.2"
rfd = "0.17.2"

# Local Servo checkout on feature-branch first-class-wasm-poc
servo = { path = "../servo/components/servo" }
servo-embedder-traits = { path = "../servo/components/shared/embedder" }
servo-url = { path = "../servo/components/url" }

euclid = "0.22"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
url = "2.5"
keyboard-types = { version = "0.8.3", features = ["serde", "webdriver"] }
winit = "0.30.13"

# System & Utilities
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"

# [profile.release]
# opt-level = 3
# lto = "fat"
# codegen-units = 1
# strip = "symbols"
# panic = "abort"


[profile.release]
opt-level = 3
lto = "thin"          # Multi-threaded LTO (80% faster than fat LTO)
codegen-units = 16    # Keeps codegen parallel
strip = "symbols"
panic = "abort"
